# Render Blueprint: one free web service running the Corpus bridge + built UI.
# Secrets are marked sync:false and are entered once in the Render dashboard.
services:
  - type: web
    name: corpus
    runtime: docker
    plan: free
    branch: deploy-fixes
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORPUS_ALLOW_ANONYMOUS
        value: "false"
      - key: CORPUS_COOKIE_SECURE
        value: "true"
      - key: CORPUS_DEV_MODE_ENABLED
        value: "false"
      - key: CORPUS_DISCORD_ENABLED
        value: "false"
      - key: CORPUS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_GATEWAY_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_NICHE_INDEX_PREFIX
        sync: false
      - key: CLOUDFLARE_WORKERS_AI_EMBED_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
